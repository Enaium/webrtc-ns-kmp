name: Test

"on":
  workflow_dispatch:

# Publishes every artifact to the local Maven repository and runs the test
# suites for each platform. Each matrix entry covers the artifacts that its
# runner can build:
#
#   macOS ARM64    -> :ns (multiplatform module), darwin JNI, JVM + native tests
#   Linux x64      -> linux JNI (x86_64 + aarch64 cross), JVM + native klibs
#   Windows x64    -> windows JNI (MinGW), JVM + native klib
#   Android        -> publish to Maven Local, assemble + instrumented test APKs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    name: Test macOS ARM64
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish all platforms to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :ns:publishToMavenLocal
          :jni-jvm-darwin-aarch64:publishToMavenLocal
          :jni-jvm-darwin-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :ns:jvmTest

      - name: Run native tests
        run: ./gradlew --no-daemon :ns:macosArm64Test

      - name: Build the waveform example
        # The example needs audio devices at runtime, which the runners do not
        # have, so the compile and link steps are validated here: the JVM
        # classes plus the full native executable (which is what proves the
        # entry point and the static library linkage).
        run: >
          ./gradlew --no-daemon
          :examples:waveform:compileKotlinJvm
          :examples:waveform:linkDebugExecutableMacosArm64

      - name: Smoke run the waveform example (headless)
        # SDL's dummy video driver keeps the window off-screen; the example
        # renders a bounded number of frames and exits. Runners have no audio
        # device, which the pipeline reports and retries past.
        run: >
          SDL_VIDEO_DRIVER=dummy ./gradlew --no-daemon
          :examples:waveform:jvmRun --args="--frames 120"

  test-linux:
    name: Test Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish ns linuxX64/mingwX64 + linux JNI to Maven Local
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :ns:publishLinuxX64PublicationToMavenLocal
          :ns:publishMingwX64PublicationToMavenLocal
          :jni-jvm-linux-x86_64:publishToMavenLocal
          :jni-jvm-linux-aarch64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon :ns:jvmTest

      - name: Compile native klibs (linuxX64, mingwX64)
        # webrtc-ns requires C++20 (std::span), but Kotlin/Native's Linux
        # toolchain ships gcc-8.3/libstdc++ which cannot link the test binary.
        # Compiling the klibs still validates that cinterop embeds the static
        # libraries built on this host (linuxX64 natively, mingwX64 via MinGW).
        run: >
          ./gradlew --no-daemon
          :ns:compileKotlinLinuxX64
          :ns:compileKotlinMingwX64

      - name: Compile the waveform example (linuxX64, mingwX64)
        # The example's own native targets for the two ABIs that cross-compile
        # from Linux; the executable itself is only linked on a matching host.
        run: >
          ./gradlew --no-daemon
          :examples:waveform:compileKotlinLinuxX64
          :examples:waveform:compileKotlinMingwX64

      - name: Verify embedded static libraries
        run: |
          for t in linuxX64 mingwX64; do
            klib=$(find ns/build -name "*${t}Cinterop-webrtcNs*.klib" | grep -v asc | head -1)
            echo "=== $t: $klib ==="
            if unzip -l "$klib" | grep -q "\.a$"; then
              echo "OK: static library embedded"
            else
              echo "FAIL: no static library in $t klib"
              exit 1
            fi
          done

  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install MinGW
        shell: pwsh
        run: |
          choco install mingw -y --no-progress
          # The JVM needs MinGW's runtime DLLs (libwinpthread-1.dll,
          # libgcc_s_seh-1.dll) on PATH to load the JNI DLL.
          echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\signing-key.gpg",
            [Convert]::FromBase64String("${{ secrets.SIGNING_KEY }}")
          )
          Get-Item "$env:RUNNER_TEMP\signing-key.gpg" | Select-Object Length
          Format-Hex -Path "$env:RUNNER_TEMP\signing-key.gpg" -Count 16

      - name: Publish windows JNI to Maven Local
        shell: cmd
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}\signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :jni-jvm-windows-x86_64:publishToMavenLocal

      - name: Run JVM tests
        run: ./gradlew --no-daemon --stacktrace :ns:jvmTest

      - name: Compile native klib (mingwX64)
        # Same toolchain limitation as linuxX64 (gcc-8.3, no C++20).
        run: ./gradlew --no-daemon :ns:compileKotlinMingwX64

  test-android:
    name: Test Android
    # GitHub-hosted runners don't support nested virtualization, so Android
    # emulators can't boot with hardware acceleration (KVM on Linux, HVF on
    # macOS). The AAR and example APK are assembled and the androidTest APK
    # is compiled; instrumented tests must be run on a local device.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | tr -d ' \n' | base64 -d > "$RUNNER_TEMP/signing-key.gpg"
          ls -la "$RUNNER_TEMP/signing-key.gpg"
          head -c 16 "$RUNNER_TEMP/signing-key.gpg" | od -c | head -2

      - name: Publish android AAR + metadata to Maven Local
        # Only the metadata + android publications: the Apple and androidNative
        # target klibs are published by the jobs whose runners can build their
        # static libraries. The basic example consumes the published artifact,
        # so it needs the AAR in the local repository before it is assembled.
        run: >
          ./gradlew --no-daemon --stacktrace
          -Psigning.keyId="${{ secrets.SIGNING_KEY_ID }}"
          -Psigning.secretKeyRingFile="${{ runner.temp }}/signing-key.gpg"
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}"
          :ns:publishKotlinMultiplatformPublicationToMavenLocal
          :ns:publishAndroidPublicationToMavenLocal

      - name: Assemble example apps and androidTest APK
        run: >
          ./gradlew --no-daemon
          :examples:basic:assembleDebug
          :examples:basic:assembleDebugAndroidTest
          :examples:waveform:android:assembleDebug

      - name: Verify embedded static libraries (androidNative)
        # The APK above linked libmain.so for every ABI, which cross-compiled
        # libwebrtc_ns.a with the NDK and embedded it into each androidNative
        # cinterop klib (the same klibs the publish job ships). Android native
        # cinterop output stays unpacked, so the embedded archive is checked
        # where the linker finds it.
        run: |
          for t in androidNativeArm64 androidNativeArm32 androidNativeX64 androidNativeX86; do
            lib=$(find "ns/build/classes/kotlin/$t" -name libwebrtc_ns.a | head -1)
            echo "=== $t: $lib ==="
            if [ -z "$lib" ]; then
              echo "FAIL: no static library in the $t cinterop klib"
              exit 1
            fi
            echo "OK: static library embedded ($(du -h "$lib" | cut -f1))"
          done

  test-web:
    name: Test Web (wasmJs)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest
          "$HOME/emsdk/emsdk" construct_env

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile the wasmJs klib and run the Node smoke test
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          :ns:compileKotlinWasmJs
          :ns:testWasmNs

      - name: Build the waveform browser distribution
        # Compiles the waveform's wasmJs target, links the NS Emscripten module
        # and copies the SDL/imgui/Web Audio runtimes next to the page.
        run: >
          ./gradlew --no-daemon --stacktrace
          -Pwasm.emsdk="$HOME/emsdk"
          :examples:waveform:wasmJsBrowserDistribution
